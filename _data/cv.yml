# CV data, rendered by _pages/cv.md via the local _layouts/cv.liquid.
#
# Section ORDER is controlled in _layouts/cv.liquid, not here:
#   Professional Summary -> Experience -> Projects -> Education -> Leadership -> Awards
#
# Which renderer each section gets is also set there. Experience and Leadership both
# use the experience renderer, so both get date + location badges. Entries for those
# two use: company / position / start_date / end_date / location / highlights.
#
# Dates are "YYYY-MM" or "YYYY". Omit end_date to render as "Present".
#
# NOTE: `name`, `email`, `phone`, `website` and `location` are intentionally left off
# the top level — setting any of them makes the gem render a "Contact Information"
# card, and contact details live in the home-page sidebar instead.

cv:
  summary: >
    Post-master's researcher at Los Alamos National Laboratory working on adversarial AI and
    machine learning, at the intersection of computer vision and the physical world. Interested
    in how AI systems fail under real-world adversarial conditions, and in supporting
    first-generation and underrepresented students in STEM.

  sections:
    Experience:
      # TODO: confirm the start date of the post-master's appointment.
      - company: Los Alamos National Laboratory
        position: Post-Master's Researcher
        url: https://www.lanl.gov/
        location: Los Alamos, NM
        start_date: 2026-01
        highlights:
          - "Adversarial AI and machine learning research with the A-4 Advanced Research in Cyber Systems group."
          - 'First-authored "Giving AI a Headache," accepted at SPIE 2026, on acoustic adversarial attacks against object detection.'

      - company: Los Alamos National Laboratory
        position: Graduate Research Assistant
        location: Los Alamos, NM
        start_date: 2025-05
        end_date: 2025-12
        highlights:
          - "Joined the A-4 Advanced Research in Cyber Systems group through the Cybersecurity School Research Program."
          - "Studied how sound degrades image stabilization in camera sensors, causing object detection inference to fail."

      # Same-year roles use a single `date:` so they render as "2024" rather than "2024 - 2024".
      - company: BlueCross BlueShield of Alabama
        position: Technology Support Intern
        location: Birmingham, AL
        date: 2024
        highlights:
          - "Rotated through mainframe, support center, contact center, Citrix, workstation, procurement, and asset management teams."

      - company: Southern Research Institute
        position: Cybersecurity Analyst
        location: Birmingham, AL
        date: 2024
        highlights:
          - "Patched software and handled response for company accounts targeted by phishing."
          - "Contributed to the company's disaster recovery report, applying information assurance practice."

      - company: Southern Research Institute
        position: Cybersecurity Analyst Intern
        location: Birmingham, AL
        date: 2023
        highlights:
          - "Managed asset security: imaging and configuring Windows machines for onboarding, and secure hardware disposal for offboarding."

    # Same order as the /projects/ page. `url` makes each title a link to the repo.
    Projects:
      - name: Giving AI a Headache
        url: https://github.com/nicolevgarduno/Giving-AI-a-Headache
        date: 2026
        summary: Degrading YOLO11 object detection by acoustically resonating camera hardware. Published at SPIE 2026.

      - name: Research Agent
        url: https://github.com/nicolevgarduno/research-agent
        date: 2026
        summary: Sends a daily email digest of the research and news most relevant to your specified interests.

      - name: GoNoGo
        url: https://github.com/nicolevgarduno/GoNoGo
        date: 2025
        summary: CI/CD pipeline that only lets code through to an expensive downstream job if it clears a static-analysis quality gate first.

      - name: StayAwake
        url: https://github.com/nicolevgarduno/StayAwake
        date: 2025
        summary: Real-time attention and drowsiness detector using eye closure, yawning, and head orientation, with per-user calibration.

      - name: FIFA Scouting Report
        url: https://github.com/nicolevgarduno/FIFA-Scouting-Report
        date: 2024
        summary: Predicting FIFA player market value from skill attributes, comparing linear regression, random forest, MLP, and CNN.

      - name: Benign and Malicious PDF Detection
        url: https://github.com/nicolevgarduno/Benign-and-Malicious-PDF-Detection
        date: 2024
        summary: Converts each PDF into a binary visualization and trains a CNN to classify it as benign or malicious.

      - name: Waste Detection Drone
        url: https://github.com/melvinczyk/Waste-detection-drone
        date: 2024
        summary: Real-time aerial trash detection from a DJI Tello using YOLOv5.

    Education:
      - institution: Carnegie Mellon University
        url: https://www.cmu.edu/ini/
        studyType: M.S. Information Security, focus in AI Engineering
        start_date: 2024-08
        end_date: 2025-12
        location: Pittsburgh, PA

      - institution: Birmingham-Southern College
        studyType: B.S. Applied Computer Science
        start_date: 2021
        end_date: 2024
        location: Birmingham, AL

    # Uses the experience renderer, so these take company/position/dates like Experience.
    # Locations are intentionally omitted here.
    Leadership:
